<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>서버 에러</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="p-4">
  <h2> 서버 에러 </h2>
  <div>에러: <span th:text="${errorMessage}">요청에러</span></div>
  <div>
    <div sec:authorize="isAuthenticated()">
      <button type="button" class="btn btn-outline-info" onclick="document.getElementById('logoutForm').submit()">
        로그아웃 후 홈으로
      </button>
      <form id="logoutForm" method="POST" action="/logout" style="display: none">
        <input id="csrfToken" type="hidden" name="_csrf" th:value="${_csrf.token}"/>
      </form>
    </div>

    <button type="button" class="btn btn-outline-primary" onclick="location.href='/'"
            th:onclick="|location.href='@{/}'|">
      홈으로 돌아가기
    </button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
