  <script>
      // 로컬 스토리지 초기화
      if (localStorage.getItem('abilityStatusEffectInfoCheck') === null) localStorage.setItem('abilityStatusEffectInfoCheck', 'true');

      // 모듈 로드
      window.require_is_configured = false;
      if (!window.require_is_configured) {
          require.config({
              baseUrl: "",
              paths: {
                  "slick": "/static/js/slick/slick",
                  "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min",
                  "createjs": "/static/js/vendors/createjs",
                  "underscore": "/static/js/vendors/underscore",
                  "backbone": "/static/js/vendors/backbone",
                  "lib/raid/extension": "/static/js/gbfap/raid_extension",
                  "lib/sound": "/static/js/gbfap/audio",
                  "js/actor": "/static/js/gbfap/actor",
                  "js/player": "/static/js/gbfap/player",
                  "js/loader": "/static/js/gbfap/loader",
              },
          });
          require([
              "slick", "underscore", "bootstrap", "createjs", "backbone", "lib/sound",
              "lib/raid/extension", "js/actor", "js/player", "js/loader",
          ], function (slick, underscore, bootstrap) {
              $(function () {
                  _ = underscore;
                  window.bootstrap = bootstrap;

                  let displayScale = localStorage.getItem('displayScale');
                  let displayScaleNumber = Number(displayScale);
                  let scale = 1;
                  if (displayScaleNumber && displayScaleNumber > 0) {
                      scale = displayScaleNumber;
                  } else if (displayScale === 'auto') {
                      scale = Math.min(window.innerWidth / 330, 2.0);
                  } else {
                      localStorage.setItem('displayScale', 'auto');
                      scale = Math.min(window.innerWidth / 330, 2.0);
                  }
                  scale = scale > 2.0 ? 2.0 : scale;
                  window.scale = scale;
                  $('#container').css({'transform': `scale(${scale})`, 'transform-origin': 'top left'});

                  // 게임 상태 초기화 및 로드
                  initGameStatus().then(() => {
                      // 오의 팝오버 초기화 (actorId 필요)
                      $('#abilitySlider .ability-panel .open-charge-attack-popover').each((index, element) => {
                          $(element).attr('data-actor-id', gameStateManager.getState('actorIds')[$(element).attr('data-actor-index')]);
                      });
                      initChargeAttackPopovers();

                      // assets, player, actor 로드
                      monkeypatch_createjs();
                      window.require_is_configured = true;
                      initActors();
                  });

                  // (상태 초기화 및 stage 로드 완료후) 로딩 오버레이 이벤트 리스너 등록
                  $('#loadingOverlay').one('actorLoadFinished', function () {
                      let $loadingOverlay = $(this);
                      let $fadeOverlay = $('#fadeOverlay');

                      // touch to start 보이게, loading 제거
                      let $readyStartInfoWrapper = $(this).find('.ready-start-info-wrapper');
                      $readyStartInfoWrapper.fadeTo('fast', 1);
                      $loadingOverlay.find('.loading-image-wrapper').fadeTo('fast', 0);

                      // 사운드 설정 확인 및 등록
                      let soundStatus = localStorage.getItem('soundStatus');
                      if (!soundStatus) localStorage.setItem('soundStatus', 'on');
                      else if (soundStatus === 'off') {
                          $('.sound-toggle-button').removeClass('btn-outline-light').addClass('btn-outline-secondary');
                          window.audio.updateDisabled(true);
                      }
                      window.audio.initVolume();

                      $loadingOverlay.one('click', function () {
                          playSe(Sounds.ui.LOADING_READY.src);
                          updateBgm(window.stage.response.processing);

                          $readyStartInfoWrapper.fadeTo(1, 0);
                          $loadingOverlay.find('.ready-image-wrapper').fadeTo('fast', 1);
                          $loadingOverlay.css('background-color', 'transparent');

                          setTimeout(() => {
                              // 오버레이 처리
                              $loadingOverlay.find('.ready-image-wrapper').fadeTo(1, 0);
                              $fadeOverlay.css({
                                  'transform': 'translateX(25%)',
                                  'transition': 'transform 0.2s ease-out',
                              }).on('transitionend', () => {
                                  $loadingOverlay.css('display', 'none');
                                  $fadeOverlay.css('display', 'none');
                              });

                              player.play(Player.playRequest('actor-0', Player.c_animations.ENEMY_PHASE_1));

                              // 행동 대기시간 설정
                              const lastMoveTime = gameStateManager.getState('lastMoveTime');
                              const cooldownMs = gameStateManager.getState('moveCooldown') * 1000;
                              if (lastMoveTime) {
                                  const availableAt = new Date(lastMoveTime.getTime() + cooldownMs);
                                  const remainingMs = availableAt - Date.now();
                                  // console.log(`[applyMoveCooldown] lastMoveTime = ${lastMoveTime}, cooldownMs = ${cooldownMs} availableAt = ${availableAt} remainingMs = ${remainingMs}`);
                                  if (remainingMs > 0) {
                                      alert('이전 턴 처리 진행 대기중입니다.');
                                      waitingProcess(true);
                                      player.lockPlayer(true);

                                      const moveCooldownTimer = setTimeout(() => {
                                          waitingProcess(false);
                                          player.lockPlayer(false);
                                          clearTimeout(moveCooldownTimer); // 명시 제거
                                      }, remainingMs);
                                  }
                              }

                              // 튜토리얼
                              if (gameStateManager.getState('isTutorial')) {
                                  setTimeout(() => {
                                      $('#resetTutorialButton').show();
                                      const tutorialManager = new TutorialManager(tutorialSteps);
                                      window.tutorialManager = tutorialManager;
                                      let tutorialIndex = Number($('#container').attr('data-tutorial-index'));
                                      if (tutorialIndex && tutorialIndex > 0) {
                                          tutorialManager.startFrom(tutorialIndex);
                                      } else {
                                          tutorialManager.start();
                                      }
                                  }, 100);
                              }

                              // 시작시 적 사망했을 경우 (또는 적 사망 새로고침)
                              if (stage.response.processing.moveType === MoveType.DEAD_DEFAULT) {
                                  let enemyDeadResponse = stage.response.processing;
                                  // hp 음수로 오는거 0 으로 변환
                                  let modedHps = [0, ...enemyDeadResponse.hps.slice(1)];
                                  let modedHpRates = [0, ...enemyDeadResponse.hpRates.slice(1)];
                                  gameStateManager.setState('hps', modedHps, {force: true});
                                  gameStateManager.setState('hpRates', modedHpRates, {force: true});

                                  setTimeout(() => processEnemyDead(enemyDeadResponse), 1500); // entry 끝나는거 고려
                              } else {
                                  doSync(); // 동기화 폴링 (적 사망시 동기화 안함)
                                  if (window.stage.response.scheduled.length > 0) {
                                      // 시작 처리 존재
                                      player.lockPlayer(true);
                                      setTimeout(() => processResponseMoves(window.stage.response.scheduled, 'turn'), 1500);
                                  }
                              }

                              // 시작시 아군 전원 사망했을 경우 (또는 아군 전원 사망 새로고침)
                              if (gameStateManager.getState('hps').slice(1).every(hp => hp <= 0) && player.getCharacters().length === 0) {
                                  gameStateManager.setState('isQuestFailed', true);
                                  player.lockPlayer(true);
                              }

                          }, 700);
                      });
                  });

              });
          });
      }
  </script>

            <button class="btn btn-xxsm btn-outline-light short-message-button">오의게이지 요청!</button>
            <button class="btn btn-xxsm btn-outline-light short-message-button">클리어효과 요청!</button>
            <button class="btn btn-xxsm btn-outline-light short-message-button">방어효과 요청!</button>
          </div>

          <!-- 스탬프 패널 (기본 숨김) -->
          <div id="stampPanel" style="display:none; padding:8px; border-top:1px solid #dee2e6;">
            <!--          <div id="stampPanel" style="display:none; padding:8px; border-top:1px solid #dee2e6; flex-wrap:wrap; gap:6px;">-->
            <img class="stamp-item" data-stamp-key="OK" src="/static/gbf/img/stamp/ok.png"
                 style="width:52px;cursor:pointer;">
            <img class="stamp-item" data-stamp-key="THANKS" src="/static/gbf/img/stamp/thanks.png"
                 style="width:52px;cursor:pointer;">
          </div>

          <div class="modal-footer" style="gap:6px; flex-wrap:nowrap;">
            <button id="toggleStampBtn" class="btn btn-outline-warning btn-sm">스탬프</button>
            <input type="text" id="chatInput" class="form-control form-control-sm"
                   placeholder="메시지..." maxlength="100" style="flex:1;">
            <button id="chatSendBtn" class="btn btn-primary btn-sm">전송</button>
          </div>

        </div>
      </div>
    </div>

  </div><!-- #moodalContainer -->

</div> <!-- #container -->


<form id="exitRoomForm" action="/room/exit" method="POST">
  <input type="hidden" name="memberId" th:value="${memberInfo.id}">
  <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
</form>

<form id="csrfForm">
  <input id="csrfToken" type="hidden" name="_csrf" th:value="${_csrf.token}"/>
</form>
