<!doctype html>
<html lang="ko">
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전투 결과</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/PretendardVariable.woff2">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <link href="/static/css/basic.css" rel="stylesheet">
  <link href="/static/css/common.css" rel="stylesheet">
  <link href="/static/css/battle/modals.css" rel="stylesheet">

  <style>

      body {
          font-size: 11.5px;
      }

      hr {
          margin: 4px 0;
      }

      .home-button {
          display: block;
          margin: 0 auto;
      }

      .info-wrapper .name {
          background-color: lightgray;
          padding: 2px 4px;
          border-radius: 5px;
      }

      .info-details {
          padding: 7px;
      }

      .enemy-portrait {
          width: 70px;
          height: 70px;
          overflow: hidden;
          border-radius: 7px;
          box-shadow: 1px 1px 1px gray;
      }

      .enemy-portrait img {
          width: 120%;
          position: relative;
          left: -10%;
          top: -10%;
      }

      #membersInfoContainer .info-details {
          display: flex;
          align-items: end;
          gap: 5px;
          padding: 3px 5px;
      }

      #membersInfoContainer .info-details .leader-actor-icon-wrapper {
          width: 40%;
          overflow: hidden;
      }

      #membersInfoContainer .info-details .leader-actor-icon-wrapper img {
          width: 160%;
          position: relative;
          left: -25%;
      }

      #membersInfoContainer .info-details .info-text-wrapper {
          width: 59%;
      }

      #membersInfoContainer .username-wrapper {
          position: relative;
      }

      #membersInfoContainer .username-wrapper .username {
          display: inline-block;
          margin-left: 15px;
      }

      .honor-icon-wrapper {
          width: 12px;
          height: 12px;
          position: absolute;
          top: -5px;
          left: 0;
      }

      .honor-icon-wrapper img {
          width: 100%;
      }

  </style>

  <script src="https://code.jquery.com/jquery.min.js"></script>
  <script src="/js/common.js" th:src="@{/js/common.js}"></script>
  <script src="/static/js/basic.js" th:src="@{/js/basic.js}"></script>
  <script src="/static/js/battle/objects.js" th:src="@{/js/battle/objects.js}"></script>

</head>
<body>
<div id="container">
  <div class="page-header">
    <h1>전투 결과</h1>
    <button class="btn btn-xxsm btn-outline-secondary" onclick="location.href='/'"><i class="bi bi-house"></i></button>
  </div>

  <div id="raidInfoContainer">
    <div class="info-wrapper tile">
      <div class="name">레이드 정보</div>
      <div class="info-details ps-0 d-flex">
        <div class="enemy-portrait">
          <img src="/static/gbf/img/body/3992088000_shadow.png" th:src="${resultInfo.enemyPortraitSrc}">
        </div>
        <div class="ms-2">
          <div class="font-lg fw-bold"><span th:text="${resultInfo.raidName}">적 이름</span></div>
          <div class="">종료 시각: <span th:text="${resultInfo.endedAt}">2025-11-11 11:33:44</span></div>
          <div class="">참전 인수: <span th:text="${resultInfo.enterUserCount}">3</span>명</div>
        </div>
      </div>
    </div>
  </div>

  <div id="itemContainer">
    <div class="info-wrapper tile">
      <div class="name">추가정보</div>
      <div class="info-details">
        <div class="" th:text="${#strings.isEmpty(additionalInfoMessage) ? '없음' : additionalInfoMessage}"></div>
      </div>
    </div>
  </div>

  <div id="memberInfoContainer">
    <div class="info-wrapper tile">
      <div class="name">내 전투 결과</div>
      <div class="info-details">
        <div class="">남은 적 체력 : <span th:text="${myInfo.enemyHp}">12억</span>
          <span class="font-md" th:text="${' (' + myInfo.enemyHpRate + '%)'}">(00%)</span></div>
        <div class=""><i class="bi bi-hourglass text-blue me-1"></i>진행 턴 : <span th:text="${myInfo.totalTurns}">22</span>턴</div>
        <div class=""><i class="bi bi-clock-fill text-dark-yellow me-1"></i>진행 시간: <span th:text="${myInfo.totalTime}">22:31</span></div>
        <hr>
        <div class="">가한 데미지: <span th:text="${myInfo.dealtDamage}">1억 2345만 1234</span>
          <span class="font-md" th:text="${' (' + myInfo.totalDamageRate + '%)'}">(55%)</span>
        </div>
        <div class="">획득 공헌도: <span th:text="${myInfo.totalHonor}">123만 3456</span></div>
      </div>
    </div>
  </div>

  <div id="membersInfoContainer">
    <div class="info-wrapper tile">
      <div class="name">멤버 전투 결과</div>
      <div class="info-details" th:each="memberInfo : ${memberInfos}">
        <div class="leader-actor-icon-wrapper">
          <img src="" th:src="${memberInfo.leaderActorIconSrc}">
        </div>
        <div class="info-text-wrapper">
          <div class="username-wrapper">
            <div class="honor-icon-wrapper" th:if="${memberInfoStat.count <= 1}">
              <img src="/static/assets/img/ui/honor-gold.png">
            </div>
            <span class="username font-lg fw-bold" th:text="${memberInfo.username}">테스트123</span>
            (<span th:text="${memberInfoStat.count}">1</span>등)
          </div>
          <div>
            <hr>
            <div class="">가한 데미지: <span th:text="${memberInfo.dealtDamage}">1억 2345만 1234</span>
              <span class="font-md" th:text="${' (' + memberInfo.totalDamageRate + '%)'}">(55%)</span></div>
            <div class="">획득 공헌도: <span th:text="${memberInfo.totalHonor}">123만 3456</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-outline-primary btn-sm home-button" onclick="location.href = '/'">홈으로</button>
</div> <!-- #container -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
